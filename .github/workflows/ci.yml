name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  build-and-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t practice-service:${{ github.sha }} .
      - name: Smoke test the container
        run: |
          docker run -d -p 8080:8000 --name smoke practice-service:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz && curl -fsS http://localhost:8080/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: Stop smoke container
        if: always()
        run: docker rm -f smoke || true
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: practice-service:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"